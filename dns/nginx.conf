# dns.soleiljaune.be : ce nom sert au DNS chiffré (port 853, géré par Technitium).
# nginx ne sert ici que la validation Let's Encrypt du certificat, et refuse tout le reste.
# Activé par un lien : /etc/nginx/sites-enabled/dns.soleiljaune.be -> /root/protego/dns/nginx.conf

server {
    listen 80;
    listen [::]:80;
    server_name dns.soleiljaune.be;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}
